    function generateTextBlocks(text,startX,startY,blockSize){const blocks=[];let cursorX=startX;for(let c=0;c<text.length;c++){const letter=PIXEL_LETTERS[text[c]];if(!letter){cursorX+=blockSize*4;continue;}for(let row=0;row<letter.length;row++)for(let col=0;col<letter[row].length;col++)if(letter[row][col]==='X')blocks.push({x:cursorX+col*blockSize,y:startY+row*blockSize,w:blockSize,h:blockSize});cursorX+=(letter[0].length+1)*blockSize;}return blocks;}

    function drawGoldenKey(){
        if(!goldenKey.active || goldenKey.collected) return;
        goldenKey.bobT += 0.06;
        const kx = goldenKey.x - camera.x;
        const ky = goldenKey.y + Math.sin(goldenKey.bobT) * 8;

        // Glow
        const glow = ctx.createRadialGradient(kx+20, ky+20, 5, kx+20, ky+20, 60);
        glow.addColorStop(0, 'rgba(255,215,0,0.8)');
        glow.addColorStop(1, 'rgba(255,215,0,0)');
        ctx.fillStyle = glow;
        ctx.beginPath();ctx.arc(kx+20, ky+20, 60, 0, Math.PI*2);ctx.fill();

        // Chave pixel art
        ctx.fillStyle = '#ffd700';
        // Cabeça da chave (anel)
        ctx.fillRect(kx+6, ky, 28, 4);
        ctx.fillRect(kx+2, ky+4, 4, 16);
        ctx.fillRect(kx+34, ky+4, 4, 16);
        ctx.fillRect(kx+6, ky+20, 28, 4);
        // Haste
        ctx.fillRect(kx+16, ky+24, 8, 20);
        // Dentes
        ctx.fillRect(kx+24, ky+32, 8, 4);
        ctx.fillRect(kx+24, ky+40, 8, 4);
        // Brilho
        ctx.fillStyle = '#fff8a0';
        ctx.fillRect(kx+10, ky+6, 8, 8);
        // Label
        ctx.fillStyle = '#ffd700';
        ctx.font = 'bold 14px "Courier New"';
        ctx.textAlign = 'center';
        const labelPulse = Math.sin(frameCount*0.1)*0.3+0.7;

        ctx.fillText('⚷ PEGUE A CHAVE!', kx+20, ky - 15);
        ctx.globalAlpha = 1;
        ctx.textAlign = 'left';
    }

    function drawRocket(rx, ry){
        // rx é posição X na tela (já com camera), ry é Y

        // === FOGO (se decolando) ===
        if(rocketTakingOff){
            // Camada 1: núcleo branco
            for(let i=0;i<4;i++){
                const fh = 50 + Math.random()*60;
                ctx.fillStyle = '#fff';
                ctx.beginPath();
                ctx.moveTo(rx-8+i*6, ry+95);
                ctx.lineTo(rx-5+i*6, ry+95+fh*0.4);
                ctx.lineTo(rx-2+i*6, ry+95);
                ctx.fill();
            }
            // Camada 2: amarelo
            for(let i=0;i<6;i++){
                const fh = 60 + Math.random()*80;
                ctx.fillStyle = '#ffdd00';
                ctx.beginPath();
                ctx.moveTo(rx-15+i*7, ry+95);
                ctx.lineTo(rx-10+i*7, ry+95+fh);
                ctx.lineTo(rx-5+i*7, ry+95);
                ctx.fill();
            }
            // Camada 3: laranja
            for(let i=0;i<8;i++){
                const fh = 40 + Math.random()*70;
                ctx.fillStyle = '#ff6600';
                ctx.globalAlpha = 0.8;
                ctx.beginPath();
                ctx.moveTo(rx-20+i*6, ry+95);
                ctx.lineTo(rx-15+i*6, ry+95+fh);
                ctx.lineTo(rx-10+i*6, ry+95);
                ctx.fill();
            }
            // Camada 4: vermelho exterior
            for(let i=0;i<6;i++){
                const fh = 30 + Math.random()*50;
                ctx.fillStyle = '#cc0000';
                ctx.globalAlpha = 0.5;
                ctx.beginPath();
                ctx.moveTo(rx-18+i*8, ry+95);
                ctx.lineTo(rx-12+i*8, ry+95+fh);
                ctx.lineTo(rx-6+i*8, ry+95);
                ctx.fill();
            }
            ctx.globalAlpha = 1;
            // Fumaça
            for(let i=0;i<3;i++) spawnSmoke(rx-camera.x*0+(Math.random()-0.5)*30+camera.x, ry+100+Math.random()*20);
        }

        // === CORPO DO FOGUETE ===
        // Nariz (cone)
        ctx.fillStyle = '#e74c3c';
        ctx.beginPath();
        ctx.moveTo(rx, ry);
        ctx.lineTo(rx-22, ry+35);
        ctx.lineTo(rx+22, ry+35);
        ctx.closePath();
        ctx.fill();
        // Ponta
        ctx.fillStyle = '#ff6666';
        ctx.beginPath();
        ctx.moveTo(rx, ry);
        ctx.lineTo(rx-10, ry+20);
        ctx.lineTo(rx+10, ry+20);
        ctx.closePath();
        ctx.fill();

        // Corpo principal
        ctx.fillStyle = '#eee';
        ctx.fillRect(rx-22, ry+35, 44, 55);
        // Detalhe lateral
        ctx.fillStyle = '#ddd';
        ctx.fillRect(rx-22, ry+35, 8, 55);
        ctx.fillRect(rx+14, ry+35, 8, 55);
        // Faixa azul
        ctx.fillStyle = '#2176ae';
        ctx.fillRect(rx-22, ry+48, 44, 8);
        // Faixa vermelha
        ctx.fillStyle = '#e74c3c';
        ctx.fillRect(rx-22, ry+70, 44, 6);

        // Janela principal
        ctx.fillStyle = '#00aaff';
        ctx.beginPath();ctx.arc(rx, ry+42, 8, 0, Math.PI*2);ctx.fill();
        ctx.fillStyle = '#88ddff';
        ctx.beginPath();ctx.arc(rx-2, ry+40, 4, 0, Math.PI*2);ctx.fill();
        // Janela secundária
        ctx.fillStyle = '#00aaff';
        ctx.beginPath();ctx.arc(rx, ry+62, 5, 0, Math.PI*2);ctx.fill();

        // Motor
        ctx.fillStyle = '#555';
        ctx.fillRect(rx-18, ry+90, 36, 8);
        ctx.fillStyle = '#333';
        ctx.fillRect(rx-14, ry+94, 28, 4);

        // === ASAS / FINS ===
        ctx.fillStyle = '#e74c3c';
        // Esquerda
        ctx.beginPath();
        ctx.moveTo(rx-22, ry+70);
        ctx.lineTo(rx-40, ry+98);
        ctx.lineTo(rx-22, ry+95);
        ctx.closePath();
        ctx.fill();
        // Direita
        ctx.beginPath();
        ctx.moveTo(rx+22, ry+70);
        ctx.lineTo(rx+40, ry+98);
        ctx.lineTo(rx+22, ry+95);
        ctx.closePath();
        ctx.fill();

        // Pernas de pouso
        if(!rocketTakingOff){
            ctx.fillStyle = '#777';
            ctx.fillRect(rx-35, ry+94, 8, 10);
            ctx.fillRect(rx+27, ry+94, 8, 10);
            ctx.fillRect(rx-38, ry+102, 14, 3);
            ctx.fillRect(rx+24, ry+102, 14, 3);
        }

        // Logo "M" no corpo
        ctx.fillStyle = '#ffd700';
        ctx.font = 'bold 14px "Courier New"';
        ctx.textAlign = 'center';
        ctx.fillText('M', rx, ry+85);
        ctx.textAlign = 'left';
    }

function drawWatermark(){

    // Watermark principal no canto inferior direito
    ctx.globalAlpha = 0.4 + Math.sin(frameCount * 0.02) * 0.1;
    ctx.fillStyle = '#ffd700';
    ctx.font = 'bold 11px "Courier New"';
    ctx.textAlign = 'right';

        ctx.fillText('© Marcos Eduardo - 2026', canvas.width - 10, canvas.height - 10);
        ctx.font = '9px "Courier New"';
        ctx.fillStyle = '#fff';
        ctx.globalAlpha = 0.3;
        ctx.fillText('Dev with Bobby IA', canvas.width - 10, canvas.height - 22);

        ctx.fillStyle = '#00ff44';
        ctx.font = 'bold 12px "Courier New"';
        ctx.textAlign = 'center';
        ctx.fillText('Desenvolvido por Marcos Eduardo + Bobby IA', canvas.width/2, canvas.height - 20);
        ctx.font = '10px "Courier New"';
        ctx.globalAlpha = 0.4;
        ctx.fillText('Portfolio Project - 3h de produção', canvas.width/2, canvas.height - 8);
    }
    
    // Na vitória - assinatura especial
    if(victoryPhase >= 10){
        ctx.globalAlpha = 0.8;
        ctx.fillStyle = '#ffd700';
        ctx.font = 'bold 14px "Courier New"';
        ctx.textAlign = 'center';
        const sig = Math.sin(frameCount * 0.05) * 0.2 + 0.8;
        ctx.globalAlpha = sig;
        ctx.shadowColor = '#ffd700';
        ctx.shadowBlur = 10;
        ctx.fillText('🏆 Marcos Eduardo - Portfolio 2024 🏆', canvas.width/2, canvas.height - 30);

    function checkCollections(){
        if(victoryPhase >= 3) return; // Cutscene, sem coleta
        coins.forEach(c=>{if(c.collected)return;if(player.x<c.x+c.w&&player.x+player.w>c.x&&player.y<c.y+c.h&&player.y+player.h>c.y){c.collected=true;score+=c.points;if(c.type==='coin'){SOUNDS.coin();spawnParticles(c.x+c.w/2,c.y+c.h/2,['#ffd700','#fff','#ffa500'],12);}else{SOUNDS.star();spawnParticles(c.x+c.w/2,c.y+c.h/2,['#ffd700','#ff8800','#fff'],25);}}});
        if(!healthItem.collected&&player.x<healthItem.x+healthItem.w&&player.x+player.w>healthItem.x&&player.y<healthItem.y+healthItem.h&&player.y+player.h>healthItem.y){healthItem.collected=true;player.lives=Math.min(player.maxLives,player.lives+1);SOUNDS.heal();spawnParticles(healthItem.x+healthItem.w/2,healthItem.y+healthItem.h/2,['#ff0066','#ff3388','#fff'],30);}
        if(!shieldItem.collected&&player.x<shieldItem.x+shieldItem.w&&player.x+player.w>shieldItem.x&&player.y<shieldItem.y+shieldItem.h&&player.y+player.h>shieldItem.y){shieldItem.collected=true;player.hasShield=true;player.shieldTimer=900;SOUNDS.shield();spawnParticles(shieldItem.x+shieldItem.w/2,shieldItem.y+shieldItem.h/2,['#0088ff','#00aaff','#fff'],20);}
        if(superAmmo.spawned&&!superAmmo.collected&&player.x<superAmmo.x+superAmmo.w&&player.x+player.w>superAmmo.x&&player.y<superAmmo.y+superAmmo.h&&player.y+player.h>superAmmo.y){superAmmo.collected=true;player.hasSuperAmmo=true;player.superShots=2;SOUNDS.superAmmo();spawnParticles(superAmmo.x+18,superAmmo.y+18,['#00ffff','#fff','#ffff00'],30);}
        if(!player.invulnerable&&!player.hasShield){enemies.forEach(e=>{if(player.x+6<e.x+e.w-6&&player.x+player.w-6>e.x+6&&player.y+player.h>e.y+e.h*0.5&&player.y+6<e.y+e.h&&player.velY<=0)takeDamage();});}
        // CHAVE DOURADA
        if(goldenKey.active && !goldenKey.collected){
            const kx=goldenKey.x, ky=goldenKey.y;
            if(player.x+player.w>kx && player.x<kx+goldenKey.w && player.y+player.h>ky && player.y<ky+goldenKey.h){
                goldenKey.collected = true;
                SOUNDS.keyGet();
                spawnParticles(kx+20, ky+20, ['#ffd700','#fff','#fff8a0'], 40);
                // Inicia cutscene automática!
                victoryPhase = 3;
                cutsceneTimer = 0;
                player.shooting = false;
            }
        }
    }
    function updateCamera(){if(victoryPhase>0)return;const tx=player.x-canvas.width/3;camera.x+=(tx-camera.x)*0.1;camera.x=Math.max(0,Math.min(LEVEL_WIDTH-canvas.width,camera.x));}
    function updateTimer(){const now=Date.now(),d=(now-lastTime)/1000;lastTime=now;if(!gameOver&&victoryPhase<3){timeLeft-=d;if(timeLeft<=0){timeLeft=0;triggerDefeat();}}}

    // ═══════════════════════════════════════
    //  🔄 GAME LOOP
    // ═══════════════════════════════════════
    function gameLoop(){
        frameCount++;ctx.clearRect(0,0,canvas.width,canvas.height);
        // Screen shake
        if(screenShake > 0){
            ctx.save();
            ctx.translate((Math.random()-0.5)*screenShake, (Math.random()-0.5)*screenShake);
        }

        if(gameState==='LOADING'){drawLoadingScreen();}
        else if(gameState==='INTRO'){drawIntroScreen();}
        else if(gameState==='DEFEAT'){drawBackground();drawPlatforms();drawSmoke();drawParticles();drawCollectibles();drawEnemies();drawBoss();updateDefeat();drawDefeat();updateParticles();updateSmoke();}
        else if(gameState==='GAME'){
            drawBackground();drawPlatforms();
            drawSecretBase(); // Só aparece se victoryPhase>=3
            updateSmoke();drawSmoke();updateParticles();drawParticles();
            drawCollectibles();
            drawGoldenKey(); // Chave dourada
            drawBullets();drawEnemies();drawBoss();drawPlayer();
            // Cutscene
            if(victoryPhase>=1){
                updateVictoryCutscene();
                drawVictoryCutscene();
            }
            drawHUD();
            if(!gameOver&&victoryPhase<=2){
                updatePlayer();updateEnemies();updateBoss();updateBullets();checkCollections();updateCamera();updateTimer();
            }
            if(!enemiesInitialized){enemiesInitialized=true;enemiesData.forEach(d=>{if(d.alive)enemies.push({...d,x:d.spawnX,w:EW,h:EH,frame:0,timer:0,shootCooldown:0,detectionRange:200,shootRange:250,velY:0,stompCount:0});});}
        }
drawWatermark();

        if(screenShake > 0) ctx.restore();
        requestAnimationFrame(gameLoop);
    }
    gameLoop();
    </script>
